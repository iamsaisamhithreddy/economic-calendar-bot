name: Bot Command Executor
on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'The Telegram Chat ID to reply to'
        required: true
      command:
        description: 'The command sent from Telegram'
        required: true

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Process Command
        id: process
        run: |
          echo "Executing command: ${{ github.event.inputs.command }}"
          # You can replace this sleep with your actual build/deploy scripts
          sleep 5 
          echo "result=Successfully processed '${{ github.event.inputs.command }}'" >> $GITHUB_OUTPUT

      - name: Reply to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ github.event.inputs.chat_id }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ GitHub Action Complete!
            Result: ${{ steps.process.outputs.result }}
