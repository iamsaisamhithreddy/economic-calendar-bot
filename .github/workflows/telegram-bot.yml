name: Telegram Bot Runner

on:
  schedule:
    - cron: '* * * * *' # Runs automatically every 5 minutes
  workflow_dispatch: # Allows you to click "Run workflow" manually to test it

jobs:
  run-bot-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Telegram Bot Task
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot_task.py
